<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <h2>K.S.R. College of Engineering</h2>
    <p>Contact Us</p>
</header>

<div class="container">
    <h2>Contact Information</h2>

    <div class="complaint-card">
        <h3>College Complaint Support</h3>
        <p><b>College:</b> K.S.R. College of Engineering</p>
        <p><b>Location:</b> Tiruchengode, Tamil Nadu</p>
        <p><b>Email:</b> support@college.edu</p>
        <p><b>Working Hours:</b> Monday - Saturday</p>
    </div>

    <h2>Send Us a Message</h2>

    <form id="contactForm">
        <input type="text" id="contactName"
            placeholder="Enter Your Name" required>

        <input type="email" id="contactEmail"
            placeholder="Enter Your Email" required>

        <textarea id="contactMessage"
            placeholder="Enter Your Message"
            rows="5" required></textarea>

        <button type="submit">Send Message</button>
    </form>

    <br>
    <a href="dashboard.html">← Back to Dashboard</a>
</div>

<script src="js/script.js"></script>
</body>
</html>
